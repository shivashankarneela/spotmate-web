<!DOCTYPE html>
<html>
<head>
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <script>
    window.spotmateListenKeyboardViewport = (listener) => {
      let frame = 0;
      const notify = () => {
        if (frame) return;
        frame = requestAnimationFrame(() => {
          frame = 0;
          listener();
        });
      };
      const events = ['resize', 'scroll'];
      for (const event of events) window.visualViewport?.addEventListener(event, notify);
      document.addEventListener('focusin', notify);
      document.addEventListener('focusout', notify);
      return () => {
        if (frame) cancelAnimationFrame(frame);
        for (const event of events) window.visualViewport?.removeEventListener(event, notify);
        document.removeEventListener('focusin', notify);
        document.removeEventListener('focusout', notify);
      };
    };
    window.spotmateKeyboardVisibleBottom = () => {
      const viewport = window.visualViewport;
      let focused = document.activeElement;
      while (focused?.shadowRoot?.activeElement) focused = focused.shadowRoot.activeElement;
      if (!viewport || Math.abs(viewport.scale - 1) > 0.01 ||
          !(focused?.matches('input, textarea') || focused?.isContentEditable)) return null;
      if (window.innerHeight - viewport.height < 90) return null;
      return viewport.height + viewport.offsetTop;
    };
    window.spotmateNotificationStatus = () =>
      typeof Notification === 'undefined' ? 'unsupported' : Notification.permission;
    window.spotmateRequestNotifications = async () => {
      if (window.spotmateNotificationStatus() !== 'default') {
        return window.spotmateNotificationStatus();
      }
      try {
        return await Notification.requestPermission();
      } catch {
        return window.spotmateNotificationStatus();
      }
    };
  </script>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="spotmate">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>spotmate</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
