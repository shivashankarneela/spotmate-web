name: SpotMate Flutter checks (no deployment)

on:
  push:
    branches:
      - "ci/**"
      - "feature/**"
      - "release/razorpay-live-prep"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build web with all payments disabled
        run: flutter build web --release --dart-define=SPOTMATE_RAZORPAY_TEST=false

      - name: Verify build exists
        run: test -s build/web/index.html && test -s build/web/main.dart.js

      - name: Build Razorpay sandbox web app
        if: github.event_name == 'push' && github.ref == 'refs/heads/ci/spotmate-flutter-checks'
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=https://psifvzftfnfhsvjlskte.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_ShFAURZ3zxK20uIqf1SxAg_QTG63Du3 \
            --dart-define=SPOTMATE_RAZORPAY_TEST=true
          test -s build/web/main.dart.js && test -s build/web/spotmate_razorpay.js

      - name: Save sandbox build
        if: github.event_name == 'push' && github.ref == 'refs/heads/ci/spotmate-flutter-checks'
        uses: actions/upload-artifact@v4
        with:
          name: spotmate-razorpay-sandbox-web
          path: build/web/
          if-no-files-found: error
          retention-days: 7

      - name: No deployment
        run: echo "Checks complete. No Vercel CLI, release upload, or live payment step is configured."
